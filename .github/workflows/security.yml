name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 6"

jobs:
  gitleaks:
    uses: nikolareljin/ci-helpers/.github/workflows/gitleaks-scan.yml@production
    with:
      scan_path: "."
      report_format: sarif
      output: results.sarif
      fail_on_findings: true
      upload_artifact: true
