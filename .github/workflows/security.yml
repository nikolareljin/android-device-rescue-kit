name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 6"

# Explicit and read-only, so this does not silently gain a write token if the
# repository or organisation default is ever changed to read-write.
permissions:
  contents: read

jobs:
  gitleaks:
    uses: nikolareljin/ci-helpers/.github/workflows/gitleaks-scan.yml@production
    with:
      scan_path: "."
      report_format: sarif
      output: results.sarif
      fail_on_findings: true
      upload_artifact: true
