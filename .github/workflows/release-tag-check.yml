name: Release Tag Check

# `push` only. A `create:` trigger was also declared with a `branches:` filter,
# but ref filters are honoured solely for push/pull_request/pull_request_target,
# so on `create` it was inert: the workflow ran for every branch and every tag
# created in the repository, and duplicated itself on release-branch creation
# because `git push -u` emits both events. `push` alone covers branch creation
# and every later push.
on:
  push:
    branches:
      - "release/*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Bootstrap ci-helpers
        run: ./scripts/bootstrap_ci_helpers.sh

      - name: Check release VERSION
        run: ./scripts/check_release_version.sh --branch "${GITHUB_REF_NAME:-}" --repo "${GITHUB_WORKSPACE:-}"

      - name: Check release tag
        run: ./scripts/check_release_tag.sh --branch "${GITHUB_REF_NAME:-}" --repo "${GITHUB_WORKSPACE:-}" --fetch-tags
