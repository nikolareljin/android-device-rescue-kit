name: PR

on:
  pull_request:

# Explicit and read-only, so this does not silently gain a write token if the
# repository or organisation default is ever changed to read-write.
permissions:
  contents: read

jobs:
  gate:
    uses: nikolareljin/ci-helpers/.github/workflows/pr-gate.yml@production
    with:
      # shellcheck is preinstalled on ubuntu-latest, but installing it makes the
      # gate independent of what the runner image happens to ship. scripts/lint.sh
      # fails rather than skips when it is absent, so the check cannot go quiet.
      lint_command: "sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck && ./scripts/lint.sh"
      test_command: "./prompt --help && ./dump --help && bash tests/run_all.sh"
      check_release_tag: true
      release_branch: ${{ github.head_ref }}
