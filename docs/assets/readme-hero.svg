<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Android Device Rescue Kit</title>
  <desc id="desc">An Android phone next to a terminal window showing a local recovery backup.</desc>
  <defs>
    <linearGradient id="bg" x1="75" y1="30" x2="1120" y2="610" gradientUnits="userSpaceOnUse"><stop stop-color="#123d35"/><stop offset=".55" stop-color="#0b2927"/><stop offset="1" stop-color="#061615"/></linearGradient>
    <linearGradient id="screen" x1="760" y1="90" x2="920" y2="480" gradientUnits="userSpaceOnUse"><stop stop-color="#235e50"/><stop offset="1" stop-color="#0a201e"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <circle cx="905" cy="208" r="178" fill="none" stroke="#8bdc9c" stroke-opacity=".18"/><circle cx="905" cy="208" r="228" fill="none" stroke="#8bdc9c" stroke-opacity=".07" stroke-width="48"/>
  <g fill="#baff71"><path d="M87 107h32v-32h18v32h32v18h-32v32h-18v-32H87z"/><path d="M195 115h12v12h-12z" opacity=".45"/><path d="M225 87h8v8h-8z" opacity=".3"/></g>
  <text x="86" y="222" fill="#baff71" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">ANDROID COMMAND-LINE RESCUE</text>
  <text x="84" y="305" fill="#edf8ef" font-family="Arial, sans-serif" font-size="64" font-weight="700">Backup first.</text>
  <text x="84" y="375" fill="#baff71" font-family="Arial, sans-serif" font-size="64" font-weight="700">Recover with confidence.</text>
  <text x="88" y="424" fill="#b9d2c5" font-family="Arial, sans-serif" font-size="22">Local backup · disaster recovery · diagnostic capture</text>
  <g filter="url(#shadow)">
    <rect x="686" y="68" width="240" height="452" rx="38" fill="#cedcd1"/>
    <rect x="697" y="78" width="218" height="432" rx="30" fill="#071918"/>
    <rect x="706" y="103" width="200" height="380" rx="24" fill="url(#screen)"/>
    <rect x="768" y="88" width="76" height="8" rx="4" fill="#70827a"/>
    <path d="M756 240h100v70a25 25 0 0 1-25 25h-50a25 25 0 0 1-25-25v-70Z" fill="#baff71"/>
    <path d="m769 235-18-22m92 22 18-22" stroke="#baff71" stroke-width="6" stroke-linecap="round"/>
    <circle cx="786" cy="278" r="5" fill="#12332d"/><circle cx="826" cy="278" r="5" fill="#12332d"/>
    <path d="M770 360h70" stroke="#3b7868" stroke-width="8" stroke-linecap="round"/><path d="M770 360h47" stroke="#baff71" stroke-width="8" stroke-linecap="round"/>
    <text x="731" y="405" fill="#dfffbf" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">RECOVERY READY</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="770" y="400" width="362" height="145" rx="14" fill="#061211" stroke="#4f8b76" stroke-width="2"/>
    <text x="797" y="440" fill="#baff71" font-family="monospace" font-size="15">$</text><text x="818" y="440" fill="#eff8f1" font-family="monospace" font-size="15"> adrescue data --recovery-profile</text>
    <text x="797" y="476" fill="#a3e4bf" font-family="monospace" font-size="16">✓ backup destination selected</text>
    <text x="797" y="506" fill="#a3e4bf" font-family="monospace" font-size="16">✓ encrypted archive created</text>
  </g>
  <text x="86" y="552" fill="#83bfa0" font-family="Arial, sans-serif" font-size="17">Your data stays local. Your next step stays clear.</text>
</svg>
